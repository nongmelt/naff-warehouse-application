# traefik/dynamic.yml — Traefik v3 DYNAMIC configuration
#
# ACCESS CONTROL is enforced by the HOST FIREWALL, not Traefik. On Docker Desktop
# the published-port proxy SNATs the client IP, so Traefik only ever sees an
# internal gateway — a Traefik ipAllowList would block every client. The Windows
# Firewall sees the real client IP; it restricts :80 to 192.168.0.0/24 and
# 192.168.1.0/24. See README "Access control".
# (On native Linux Docker the client IP is preserved — there you COULD add an
#  ipAllowList middleware here instead. This stack targets Docker Desktop.)
#
# STAGE 1 (active): dashboard reachable by the server's LAN IP (http://<server-ip>/).
# STAGE 2 (commented): per-service hostnames once *.warehouse.local resolves.

http:
  routers:
    # Catch-all: any host (incl. http://<server-ip>/) -> dashboard.
    dashboard:
      rule: "PathPrefix(`/`)"
      entryPoints: [web]
      service: frontend

    # ── STAGE 2 — uncomment once *.warehouse.local resolves ──────────────────
    # backend:
    #   rule: "Host(`api.warehouse.local`)"
    #   entryPoints: [web]
    #   service: backend
    # minio-api:
    #   rule: "Host(`minio.warehouse.local`)"
    #   entryPoints: [web]
    #   service: minio-api
    # minio-console:
    #   rule: "Host(`console.warehouse.local`)"
    #   entryPoints: [web]
    #   service: minio-console
    # traefik-dashboard:
    #   rule: "Host(`traefik.warehouse.local`)"
    #   entryPoints: [web]
    #   service: api@internal

  services:
    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:3000"

    # ── STAGE 2 services ─────────────────────────────────────────────────────
