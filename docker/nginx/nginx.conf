worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    # Add more backend servers here to load-balance across multiple instances.
    upstream backend {
        server backend:8080;
        # server backend2:8080;
    }

    upstream minio_api {
        server minio:9000;
    }

    upstream minio_console {
        server minio:9001;
    }

    # ── Backend API  (api.warehouse.local) ────────────────────────────────────
    server {
        listen 80;
        server_name api.warehouse.local;

        location / {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ── MinIO S3 API  (minio.warehouse.local) ─────────────────────────────────
    server {
        listen 80;
        server_name minio.warehouse.local;

        # Required for MinIO large-object uploads
        ignore_invalid_headers off;
        client_max_body_size   0;
        proxy_buffering        off;
        proxy_request_buffering off;

        location / {
            proxy_pass            http://minio_api;
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300;
            proxy_http_version    1.1;
            proxy_set_header      Connection "";
            chunked_transfer_encoding off;
        }
    }

    # ── MinIO Console  (console.warehouse.local) ──────────────────────────────
    server {
        listen 80;
        server_name console.warehouse.local;

        ignore_invalid_headers off;
        client_max_body_size   0;
        proxy_buffering        off;

        location / {
            proxy_pass          http://minio_console;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            # WebSocket support (required by MinIO console)
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
        }
    }
}
