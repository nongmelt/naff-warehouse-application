services:
  dnsmasq:
    image: jpillora/dnsmasq:latest
    restart: always
    ports:
      - "0.0.0.0:53:53/udp"
      - "0.0.0.0:53:53/tcp"
      - "0.0.0.0:5380:8080"   # dnsmasq web UI
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
    cap_add:
      - NET_ADMIN
    environment:
      - HTTP_USER=${DNSMASQ_UI_USER:-admin}
      - HTTP_PASS=${DNSMASQ_UI_PASS:-admin}
