<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidebar identity + Claude-style Settings — Round 2 (V2 modal)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400..800&display=swap" rel="stylesheet">
<style>
/* ============ product tokens (frontend/app/globals.css) ============ */
:root{
  --brand:#CF4500; --brand-hover:#9A3A0A; --brand-surface:#FFF0E8;
  --background:#F3F0EE; --foreground:#141413;
  --card:#FFFFFF; --lifted:#FCFBFA;
  --sidebar:#FFFFFF; --sidebar-border:#E8E2DA;
  --muted:#F4F4F4; --muted-foreground:#696969;
  --border:#E8E2DA; --accent:#F37338;
  --dust:#D1CDC7;
  --scrim:rgba(20,20,19,.38);
  --card-shadow:0px 10px 30px rgba(20,20,19,.11),0px 2px 6px rgba(20,20,19,.05);
}
.dark{
  --brand:#F37338; --brand-hover:#CF4500; --brand-surface:#2A1A0A;
  --background:#141413; --foreground:#F3F0EE;
  --card:#1E1E1D; --lifted:#1E1E1D;
  --sidebar:#1A1A19; --sidebar-border:#333332;
  --muted:#262627; --muted-foreground:#A8A8A8;
  --border:#333332; --dust:#555555;
  --scrim:rgba(0,0,0,.55);
  --card-shadow:0px 8px 26px rgba(0,0,0,.46),0px 1px 3px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Sofia Sans",system-ui,sans-serif;background:var(--background);color:var(--foreground);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
svg{flex-shrink:0}

/* ============ shell ============ */
.shell{display:flex;height:100vh}
main{flex:1;overflow-y:auto;padding:28px 36px}

/* ============ sidebar ============ */
aside{
  width:230px;background:var(--sidebar);border-right:1px solid var(--sidebar-border);
  display:flex;flex-direction:column;transition:width .15s ease;
}
aside.rail{width:56px}
.brandrow{display:flex;align-items:center;gap:10px;padding:16px 14px 12px}
.brandmark{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.brandname{font-weight:800;font-size:15px;letter-spacing:-.01em}
aside.rail .brandname{display:none}
nav{flex:1;overflow-y:auto;padding:4px 8px}
.gh{display:flex;align-items:center;gap:7px;padding:10px 8px 4px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-foreground)}
aside.rail .gh span{display:none}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;
  font-size:13px;font-weight:600;color:var(--muted-foreground);width:100%;text-align:left;
}
.nav-item:hover{background:var(--muted);color:var(--foreground)}
.nav-item.active{background:var(--brand-surface);color:var(--brand)}
aside.rail .nav-item{justify-content:center}
aside.rail .nav-item span{display:none}
.beta{border-radius:4px;background:color-mix(in srgb,var(--brand) 10%,transparent);padding:1px 4px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--brand)}
aside.rail .beta{display:none}
.divider{height:1px;background:var(--sidebar-border);margin:8px 6px}

/* ============ footer identity ============ */
.foot{border-top:1px solid var(--sidebar-border);padding:8px;position:relative}
.userrow{
  display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:10px;text-align:left;
}
.userrow:hover{background:var(--muted)}
.avatar{
  width:28px;height:28px;border-radius:50%;background:var(--brand-surface);color:var(--brand);
  display:grid;place-items:center;font-size:11px;font-weight:800;flex-shrink:0;
}
.uname{font-size:13px;font-weight:700;line-height:1.1}
.umail{font-size:10.5px;color:var(--muted-foreground);line-height:1.2}
.chev{margin-left:auto;color:var(--muted-foreground)}
aside.rail .uname,aside.rail .umail,aside.rail .chev{display:none}
aside.rail .userrow{justify-content:center;padding:6px 0}
.collapse-btn{
  display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;margin-top:2px;border-radius:9px;
  font-size:12px;color:var(--muted-foreground);
}
.collapse-btn:hover{background:var(--muted);color:var(--foreground)}
aside.rail .collapse-btn{justify-content:center}
aside.rail .collapse-btn span{display:none}
.version{padding:4px 10px 0;font-size:10px;color:var(--muted-foreground);opacity:.55}
aside.rail .version{display:none}

/* ============ user menu popover (V2 slim + theme quick-row) ============ */
.umenu{
  position:absolute;bottom:calc(100% + 6px);left:8px;width:230px;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--card-shadow);padding:6px;z-index:40;display:none;
}
.umenu.show{display:block}
.mi{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:600}
.mi:hover{background:var(--muted)}
.mi.danger{color:var(--brand)}
.mtheme{display:flex;gap:4px;padding:4px 8px 6px}
.mtheme button{
  flex:1;padding:5px 0;border-radius:8px;font-size:11px;font-weight:700;color:var(--muted-foreground);
  border:1.5px solid var(--border);background:var(--lifted);
}
.mtheme button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-surface)}

/* ============ fake dashboard backdrop (settings is no longer a page) ============ */
.bk-title{font-size:22px;font-weight:800;letter-spacing:-.01em}
.bk-sub{color:var(--muted-foreground);font-size:12px;margin:2px 0 20px}
.bk-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.bk-card{background:var(--card);border:1px solid var(--border);border-radius:16px;height:96px;padding:14px;box-shadow:var(--card-shadow)}
.bk-card .l{width:56%;height:10px;border-radius:5px;background:var(--muted)}
.bk-card .n{width:34%;height:22px;border-radius:7px;background:var(--muted);margin-top:14px}
.bk-table{background:var(--card);border:1px solid var(--border);border-radius:16px;height:46vh;padding:16px;box-shadow:var(--card-shadow)}
.bk-row{height:12px;border-radius:6px;background:var(--muted);margin-bottom:16px}
.bk-row:nth-child(odd){width:96%}.bk-row:nth-child(even){width:88%}

/* ============ settings modal (Claude.ai structure) ============ */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(1.5px);z-index:50;display:none}
.scrim.show{display:block}
.smodal{
  position:fixed;inset:0;z-index:55;display:none;place-items:center;
}
.smodal.show{display:grid}
.spanel{
  width:760px;max-width:94vw;height:520px;max-height:88vh;
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--card-shadow);display:flex;overflow:hidden;
  animation:pop .16s ease-out;
}
@keyframes pop{from{transform:scale(.97);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.spanel{animation:none}}
.snav{
  width:200px;flex-shrink:0;background:var(--lifted);border-right:1px solid var(--border);
  padding:16px 10px;
}
.snav .stitle{font-size:15px;font-weight:800;padding:0 10px 12px}
.snav .nav-item{font-size:13px}
.sbody{flex:1;min-width:0;display:flex;flex-direction:column}
.shead{display:flex;align-items:center;padding:16px 20px 0}
.sclose{
  margin-left:auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  color:var(--muted-foreground);border:1.5px solid transparent;
}
.sclose:hover{border-color:var(--border);color:var(--foreground)}
.scontent{flex:1;overflow-y:auto;padding:6px 28px 28px}
h2.pref{font-size:18px;font-weight:800;letter-spacing:-.01em;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:22px}
.srow{display:flex;gap:24px;align-items:flex-start;justify-content:space-between}
.slabel{font-size:14px;font-weight:700}
.scaption{font-size:12px;color:var(--muted-foreground);margin-top:3px;max-width:220px;line-height:1.45}

/* theme cards */
.tcards{display:flex;gap:12px}
.tcard{display:flex;flex-direction:column;align-items:center;gap:7px}
.thumb{
  width:96px;height:66px;border-radius:11px;border:2px solid var(--border);overflow:hidden;position:relative;
  transition:border-color .12s;
}
.tcard:hover .thumb{border-color:var(--dust)}
.tcard.on .thumb{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.tcard .tlabel{font-size:12px;font-weight:700;color:var(--muted-foreground)}
.tcard.on .tlabel{color:var(--brand)}
.mini{position:absolute;inset:0;display:flex}
.mini .mside{width:26%;height:100%;border-right:1px solid}
.mini .mbody{flex:1;padding:8px 8px}
.mini .bar{height:5px;border-radius:3px;margin-bottom:5px}
.mini.light{background:#F3F0EE}
.mini.light .mside{background:#FFFFFF;border-color:#E8E2DA}
.mini.light .bar{background:#DDD8D2}
.mini.dark{background:#141413}
.mini.dark .mside{background:#1A1A19;border-color:#333332}
.mini.dark .bar{background:#33322F}
.half{position:absolute;inset:0;clip-path:polygon(100% 0,100% 100%,0 100%)}

/* ============ control bar ============ */
.bar{
  position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;
  display:flex;align-items:center;gap:4px;background:#141413;color:#F3F0EE;
  border-radius:999px;padding:6px 8px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:12px;
}
.dark .bar{background:#F3F0EE;color:#141413}
.bar button{padding:5px 10px;border-radius:999px;font-weight:700;font-size:12px;opacity:.85}
.bar button:hover{opacity:1;background:rgba(128,128,128,.25)}
.bar .vlabel{padding:0 6px;font-weight:800}
.bar .sep{width:1px;height:16px;background:currentColor;opacity:.25;margin:0 3px}
</style>
</head>
<body>
<div class="shell">
  <aside id="aside"></aside>
  <main>
    <div class="bk-title">Home</div>
    <div class="bk-sub">Dashboard backdrop — Settings now opens as a pop-up, /settings page retired.</div>
    <div class="bk-cards">
      <div class="bk-card"><div class="l"></div><div class="n"></div></div>
      <div class="bk-card"><div class="l"></div><div class="n"></div></div>
      <div class="bk-card"><div class="l"></div><div class="n"></div></div>
      <div class="bk-card"><div class="l"></div><div class="n"></div></div>
    </div>
    <div class="bk-table">
      <div class="bk-row"></div><div class="bk-row"></div><div class="bk-row"></div><div class="bk-row"></div>
      <div class="bk-row"></div><div class="bk-row"></div><div class="bk-row"></div><div class="bk-row"></div>
    </div>
  </main>
</div>

<!-- settings modal -->
<div class="scrim" id="scrim" onclick="closeSettings()"></div>
<div class="smodal" id="smodal">
  <div class="spanel" role="dialog" aria-modal="true">
    <div class="snav">
      <div class="stitle">Settings</div>
      <button class="nav-item active" style="width:100%" id="generalTab"></button>
    </div>
    <div class="sbody">
      <div class="shead"><button class="sclose" onclick="closeSettings()" title="Close">✕</button></div>
      <div class="scontent">
        <h2 class="pref">Preferences</h2>
        <div class="srow">
          <div>
            <div class="slabel">Appearance</div>
            <div class="scaption">Choose how the dashboard looks. "System" follows this device's colour scheme.</div>
          </div>
          <div class="tcards" id="tcards"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="bar">
  <div class="vlabel">Round 2 — V2 modal</div>
  <div class="sep"></div>
  <button onclick="openSettings()">Settings</button>
  <button onclick="toggleDark()" id="darkbtn">Dark</button>
  <button onclick="toggleRail()">Rail</button>
</div>

<script>
/* MOCKUP round 2 — wayfinder map #91, tickets #94 + #95.
   Feedback applied: V2 chosen (Support under "Help" group, slim user menu with theme quick-row);
   Support icon → headset (headphones over rounded face); Settings is a Claude.ai-style pop-up
   modal (left "Settings" nav column with General, right content), /settings page retired;
   Preview card removed. */

const USER = { name: "Pongporn Supa", email: "keng1464@gmail.com", initials: "PS" };

const icon = p => `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  home:  icon('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>'),
  box:   icon('<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/>'),
  bolt:  icon('<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>'),
  users: icon('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M17.7 15.4c2 .7 3.4 2.2 3.8 4.6"/>'),
  mon:   icon('<rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>'),
  imp:   icon('<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/>'),
  flag:  icon('<path d="M5 21V4"/><path d="M5 4h13l-2.5 4L18 12H5"/>'),
  pie:   icon('<path d="M12 2v10h10"/><circle cx="12" cy="12" r="10"/>'),
  trophy:icon('<path d="M8 4h8v6a4 4 0 0 1-8 0z"/><path d="M8 5H4.5A1.5 1.5 0 0 0 6 9h2M16 5h3.5A1.5 1.5 0 0 1 18 9h-2"/><path d="M12 14v4M8 21h8"/>'),
  doc:   icon('<path d="M6 2h9l4 4v16H6z"/><path d="M14 2v5h5"/>'),
  clock: icon('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>'),
  bill:  icon('<path d="M5 3h14v18l-2.3-1.5L14.4 21l-2.4-1.5L9.6 21l-2.3-1.5L5 21z"/><path d="M9 8h6M9 12h6"/>'),
  /* headset: headphone band + earpads around a rounded face */
  headset: icon('<path d="M4 14v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="13.5" width="4" height="6" rx="2"/><rect x="17" y="13.5" width="4" height="6" rx="2"/><circle cx="12" cy="13.5" r="3.2"/><path d="M10.8 14.6c.7.6 1.7.6 2.4 0"/>'),
  gear:  icon('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.18a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'),
  out:   icon('<path d="M15 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/>'),
  chevUD:icon('<path d="m7 15 5 5 5-5M7 9l5-5 5 5"/>'),
  chevL: icon('<path d="m15 18-6-6 6-6"/>'),
  chevR: icon('<path d="m9 18 6-6-6-6"/>'),
};

const groups = [
  { label:"Operation", items:[
    ["Home",I.home,"active"],["Products",I.box],["Live Leaderboard",I.bolt],["Operators",I.users],
    ["Stations",I.mon],["Import orders",I.imp],["Delivery Issues",I.flag,null,"beta"] ]},
  { label:"Analytics", items:[["Insights",I.pie],["Leaderboard",I.trophy],["Reports",I.doc],["Timeline",I.clock]]},
  { label:"Invoices",  items:[["Issue Invoice",I.bill]]},
  { label:"Help",      items:[["Support",I.headset]]},
];

let rail=false, menuOpen=false, themeSel="system";

function renderSidebar(){
  const navHtml=groups.map(g=>`
    <div class="gh"><span>${g.label}</span></div>
    ${g.items.map(([label,ic,active,beta])=>`
      <button class="nav-item${active?" active":""}">${ic}<span>${label}${beta?' <span class="beta">Beta</span>':''}</span></button>
    `).join("")}
  `).join('<div class="divider"></div>');

  const menu=`
    <div class="umenu${menuOpen?" show":""}">
      <button class="mi" onclick="openSettings();event.stopPropagation()">${I.gear}Settings</button>
      <div class="mtheme">
        ${["system","dark","light"].map(t=>`<button class="${themeSel===t?"on":""}" onclick="pick('${t}');event.stopPropagation()">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}
      </div>
      <button class="mi danger">${I.out}Log out</button>
    </div>`;

  document.getElementById("aside").innerHTML=`
    <div class="brandrow"><div class="brandmark">N</div><div class="brandname">NAFF Warehouse</div></div>
    <nav>${navHtml}</nav>
    <div class="foot">
      ${menu}
      <button class="userrow" onclick="toggleMenu(event)">
        <div class="avatar">${USER.initials}</div>
        <div><div class="uname">${USER.name}</div><div class="umail">${USER.email}</div></div>
        <span class="chev">${I.chevUD}</span>
      </button>
      <button class="collapse-btn" onclick="toggleRail()">${rail?I.chevR:I.chevL}<span>Collapse</span></button>
      <div class="version">v1.1.3</div>
    </div>`;
  document.getElementById("aside").classList.toggle("rail",rail);
  document.getElementById("generalTab").innerHTML=`${I.gear}<span>General</span>`;
}

function renderTheme(){
  const mk=(t,thumb)=>`
    <button class="tcard${themeSel===t?" on":""}" onclick="pick('${t}')">
      <div class="thumb">${thumb}</div><div class="tlabel">${t[0].toUpperCase()+t.slice(1)}</div>
    </button>`;
  const light=`<div class="mini light"><div class="mside"></div><div class="mbody"><div class="bar" style="width:70%"></div><div class="bar" style="width:45%"></div><div class="bar" style="width:58%"></div></div></div>`;
  const dark=`<div class="mini dark"><div class="mside"></div><div class="mbody"><div class="bar" style="width:70%"></div><div class="bar" style="width:45%"></div><div class="bar" style="width:58%"></div></div></div>`;
  const sys=light+`<div class="half">${dark}</div>`;
  document.getElementById("tcards").innerHTML=mk("system",sys)+mk("dark",dark)+mk("light",light);
}

function openSettings(){menuOpen=false;renderSidebar();document.getElementById("scrim").classList.add("show");document.getElementById("smodal").classList.add("show");}
function closeSettings(){document.getElementById("scrim").classList.remove("show");document.getElementById("smodal").classList.remove("show");}
function toggleMenu(e){e.stopPropagation();menuOpen=!menuOpen;renderSidebar();}
function toggleRail(){rail=!rail;menuOpen=false;renderSidebar();}
function pick(t){
  themeSel=t;
  const dark = t==="dark" || (t==="system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark",dark);
  syncDarkBtn();renderSidebar();renderTheme();
}
function toggleDark(){document.documentElement.classList.toggle("dark");syncDarkBtn();}
function syncDarkBtn(){document.getElementById("darkbtn").textContent=document.documentElement.classList.contains("dark")?"Light":"Dark";}
document.addEventListener("click",()=>{if(menuOpen){menuOpen=false;renderSidebar();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSettings();});
renderSidebar();renderTheme();
openSettings(); /* open on load for review */
</script>
</body>
</html>
