<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support page + Settings rebrand — Round 4 (/support views)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400..800&display=swap" rel="stylesheet">
<style>
/* ============ product tokens (frontend/app/globals.css) ============ */
:root{
  --brand:#CF4500; --brand-hover:#9A3A0A; --brand-surface:#FFF0E8;
  --background:#F3F0EE; --foreground:#141413;
  --card:#FFFFFF; --lifted:#FCFBFA;
  --sidebar:#FFFFFF; --sidebar-border:#E8E2DA;
  --muted:#F4F4F4; --muted-foreground:#696969;
  --border:#E8E2DA; --accent:#F37338;
  --dust:#D1CDC7;
  --scrim:rgba(20,20,19,.38);
  --card-shadow:0px 10px 30px rgba(20,20,19,.11),0px 2px 6px rgba(20,20,19,.05);
  --open:#1A7F37; --open-surface:#DDF4E4;
  --done:#8250DF; --done-surface:#EFE7FD;
  --gray:#6E7781; --gray-surface:#ECEEF0;
}
.dark{
  --brand:#F37338; --brand-hover:#CF4500; --brand-surface:#2A1A0A;
  --background:#141413; --foreground:#F3F0EE;
  --card:#1E1E1D; --lifted:#1E1E1D;
  --sidebar:#1A1A19; --sidebar-border:#333332;
  --muted:#262627; --muted-foreground:#A8A8A8;
  --border:#333332; --dust:#555555;
  --scrim:rgba(0,0,0,.55);
  --card-shadow:0px 8px 26px rgba(0,0,0,.46),0px 1px 3px rgba(0,0,0,.5);
  --open:#3FB950; --open-surface:#12261A;
  --done:#A371F7; --done-surface:#211A2E;
  --gray:#8B949E; --gray-surface:#26282B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Sofia Sans",system-ui,sans-serif;background:var(--background);color:var(--foreground);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg{flex-shrink:0}

/* ============ shell ============ */
.shell{display:flex;height:100vh}
main{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ============ page header bar (Delivery Issues pattern) ============ */
.pagehead{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  height:60px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;
}
.ph-title{display:flex;align-items:baseline;gap:10px}
.ph-title h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
.ph-sub{font-size:13px;color:var(--muted-foreground)}
.ph-sub b{color:var(--foreground);font-weight:700}
.crumb{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted-foreground)}
.crumb button{color:var(--muted-foreground);font-weight:500}
.crumb button:hover{color:var(--foreground)}
.crumb .cur{font-weight:700;color:var(--foreground)}
.searchpill{
  display:flex;align-items:center;gap:8px;height:34px;width:230px;
  border:1px solid var(--border);background:var(--background);border-radius:999px;
  padding:0 14px;color:var(--muted-foreground);
}
.searchpill input{border:none;outline:none;background:transparent;font-size:12.5px;width:100%;color:var(--foreground)}
.pbody{flex:1;overflow-y:auto;padding:20px 24px}
.btn.pill{border-radius:999px;height:34px;padding:0 15px}

/* detail two-column (Delivery Issues report layout) */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.sidecard{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--card-shadow);padding:16px 18px;margin-bottom:14px}
.sclabel{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-foreground);margin-bottom:12px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px}
.kv .k{color:var(--muted-foreground)}
.kv .v{font-weight:700;text-align:right;display:flex;align-items:center;gap:7px}
.reasonsel{width:100%;border:1.5px solid var(--border);background:var(--card);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;margin-bottom:10px}
.sidenote{font-size:11.5px;color:var(--muted-foreground);line-height:1.45;margin-top:10px}

/* new-ticket modal (Delivery Issues ReportIssueModal pattern: top-anchored, 520px) */
#nmodal{place-items:start center;padding-top:48px}
.npanel{
  width:520px;max-width:94vw;max-height:88vh;
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--card-shadow);display:flex;flex-direction:column;overflow:hidden;
  animation:pop .16s ease-out;
}
.nhead{display:flex;align-items:center;padding:16px 20px 8px}
.ntitle{font-size:16px;font-weight:800;letter-spacing:-.01em}
.nbody{flex:1;overflow-y:auto;padding:8px 20px 16px}
.nfoot{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--border);background:var(--lifted)}

/* file attachment chip */
.fchip{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--lifted);
  border-radius:10px;padding:7px 11px;font-size:12px;font-weight:600;position:relative;
}
.fchip .fsize{font-size:10.5px;color:var(--muted-foreground);font-weight:500}

/* ============ sidebar ============ */
aside{
  width:230px;background:var(--sidebar);border-right:1px solid var(--sidebar-border);
  display:flex;flex-direction:column;transition:width .15s ease;
}
aside.rail{width:56px}
.brandrow{display:flex;align-items:center;gap:10px;padding:16px 14px 12px}
.brandmark{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.brandname{font-weight:800;font-size:15px;letter-spacing:-.01em}
aside.rail .brandname{display:none}
nav{flex:1;overflow-y:auto;padding:4px 8px}
.gh{display:flex;align-items:center;gap:7px;padding:10px 8px 4px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-foreground)}
aside.rail .gh span{display:none}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;
  font-size:13px;font-weight:600;color:var(--muted-foreground);width:100%;text-align:left;
}
.nav-item:hover{background:var(--muted);color:var(--foreground)}
.nav-item.active{background:var(--brand-surface);color:var(--brand)}
aside.rail .nav-item{justify-content:center}
aside.rail .nav-item span{display:none}
.beta{border-radius:4px;background:color-mix(in srgb,var(--brand) 10%,transparent);padding:1px 4px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--brand)}
aside.rail .beta{display:none}
.divider{height:1px;background:var(--sidebar-border);margin:8px 6px}

/* ============ footer identity ============ */
.foot{border-top:1px solid var(--sidebar-border);padding:8px;position:relative}
.userrow{
  display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:10px;text-align:left;
}
.userrow:hover{background:var(--muted)}
.avatar{
  width:28px;height:28px;border-radius:50%;background:var(--brand-surface);color:var(--brand);
  display:grid;place-items:center;font-size:11px;font-weight:800;flex-shrink:0;
}
.uname{font-size:13px;font-weight:700;line-height:1.1}
.umail{font-size:10.5px;color:var(--muted-foreground);line-height:1.2}
.chev{margin-left:auto;color:var(--muted-foreground)}
aside.rail .uname,aside.rail .umail,aside.rail .chev{display:none}
aside.rail .userrow{justify-content:center;padding:6px 0}
.collapse-btn{
  display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;margin-top:2px;border-radius:9px;
  font-size:12px;color:var(--muted-foreground);
}
.collapse-btn:hover{background:var(--muted);color:var(--foreground)}
aside.rail .collapse-btn{justify-content:center}
aside.rail .collapse-btn span{display:none}
.version{padding:4px 10px 0;font-size:10px;color:var(--muted-foreground);opacity:.55}
aside.rail .version{display:none}

/* ============ user menu popover (V2 slim + theme quick-row) ============ */
.umenu{
  position:absolute;bottom:calc(100% + 6px);left:8px;width:230px;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--card-shadow);padding:6px;z-index:40;display:none;
}
.umenu.show{display:block}
.mi{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:600}
.mi:hover{background:var(--muted)}
.mi.danger{color:var(--brand)}
.mtheme{display:flex;gap:4px;padding:4px 8px 6px}
.mtheme button{
  flex:1;padding:5px 0;border-radius:8px;font-size:11px;font-weight:700;color:var(--muted-foreground);
  border:1.5px solid var(--border);background:var(--lifted);
}
.mtheme button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-surface)}

/* ============ settings modal (Claude.ai structure) ============ */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(1.5px);z-index:50;display:none}
.scrim.show{display:block}
.smodal{position:fixed;inset:0;z-index:55;display:none;place-items:center}
.smodal.show{display:grid}
.spanel{
  width:760px;max-width:94vw;height:520px;max-height:88vh;
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--card-shadow);display:flex;overflow:hidden;
  animation:pop .16s ease-out;
}
@keyframes pop{from{transform:scale(.97);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.spanel{animation:none}}
.snav{width:200px;flex-shrink:0;background:var(--lifted);border-right:1px solid var(--border);padding:16px 10px}
.snav .stitle{font-size:15px;font-weight:800;padding:0 10px 12px}
.snav .nav-item{font-size:13px}
.sbody{flex:1;min-width:0;display:flex;flex-direction:column}
.shead{display:flex;align-items:center;padding:16px 20px 0}
.sclose{
  margin-left:auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  color:var(--muted-foreground);border:1.5px solid transparent;
}
.sclose:hover{border-color:var(--border);color:var(--foreground)}
.scontent{flex:1;overflow-y:auto;padding:6px 28px 28px}
h2.pref{font-size:18px;font-weight:800;letter-spacing:-.01em;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:22px}
.srow{display:flex;gap:24px;align-items:center;justify-content:space-between}
.slabel{font-size:14px;font-weight:700}
.tseg{display:inline-flex;align-items:center;gap:2px;background:var(--muted);border-radius:10px;padding:3px}
.tseg button{width:32px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--muted-foreground);transition:all .12s}
.tseg button:hover{color:var(--foreground)}
.tseg button.on{background:var(--card);color:var(--foreground);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* ============ /support shared ============ */
.pg-title{font-size:22px;font-weight:800;letter-spacing:-.01em}
.pg-sub{color:var(--muted-foreground);font-size:12px;margin:2px 0 20px}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;
  font-size:13px;font-weight:700;border:1.5px solid transparent;
}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-hover)}
.btn.ghost{border-color:var(--border);background:var(--card);color:var(--foreground)}
.btn.ghost:hover{background:var(--muted)}
.chip{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
  font-size:10.5px;font-weight:800;letter-spacing:.02em;
}
.chip.bug{background:color-mix(in srgb,#D1242F 12%,transparent);color:#D1242F}
.dark .chip.bug{background:#2C1517;color:#F85149}
.chip.feature_request{background:color-mix(in srgb,#0969DA 11%,transparent);color:#0969DA}
.dark .chip.feature_request{background:#121D2F;color:#58A6FF}
.chip.question{background:color-mix(in srgb,#9A6700 13%,transparent);color:#9A6700}
.dark .chip.question{background:#272115;color:#D29922}
.chip.data_problem{background:var(--done-surface);color:var(--done)}
.chip.other{background:var(--gray-surface);color:var(--gray)}
.spill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800}
.spill.open{background:var(--open-surface);color:var(--open)}
.spill.closed{background:var(--done-surface);color:var(--done)}
.spill.closed.gray{background:var(--gray-surface);color:var(--gray)}

/* ============ /support list ============ */
.list-head{display:flex;align-items:flex-start;gap:16px}
.list-head .grow{flex:1}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--card-shadow);overflow:hidden}
.filterbar{display:flex;align-items:center;gap:2px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--lifted)}
.ftab{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9px;
  font-size:12.5px;font-weight:700;color:var(--muted-foreground);
}
.ftab:hover{color:var(--foreground);background:var(--muted)}
.ftab.on{color:var(--foreground);background:var(--muted)}
.fcount{font-size:10.5px;font-weight:800;background:var(--gray-surface);color:var(--gray);border-radius:999px;padding:1px 7px}
.ftab.on .fcount{background:var(--brand-surface);color:var(--brand)}
.fspacer{flex:1}
.catsel{
  border:1.5px solid var(--border);background:var(--card);border-radius:9px;
  padding:5px 8px;font-size:12px;font-weight:600;color:var(--muted-foreground);
}
.trow{
  display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border-bottom:1px solid var(--border);
  width:100%;text-align:left;
}
.trow:last-child{border-bottom:none}
.trow:hover{background:var(--lifted)}
.sic{margin-top:1px}
.sic.open{color:var(--open)}
.sic.done{color:var(--done)}
.sic.gray{color:var(--gray)}
.trow .tmain{flex:1;min-width:0}
.ttitle{font-size:13.5px;font-weight:700;line-height:1.3;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tmeta{font-size:11px;color:var(--muted-foreground);margin-top:3px}
.tright{display:flex;align-items:center;gap:12px;color:var(--muted-foreground);font-size:11px;flex-shrink:0;margin-top:2px}
.ccount{display:inline-flex;align-items:center;gap:4px}
.empty{padding:40px;text-align:center;color:var(--muted-foreground);font-size:13px}

/* ============ /support new form ============ */
.formcard{max-width:640px}
.frow{margin-bottom:18px}
.flabel{display:flex;align-items:baseline;gap:6px;font-size:13px;font-weight:800;margin-bottom:6px}
.freq{color:var(--brand);font-size:11px;font-weight:800}
.fhint{font-size:11px;color:var(--muted-foreground);font-weight:500;margin-left:auto}
.finput,.ftext{
  width:100%;border:1.5px solid var(--border);background:var(--card);border-radius:10px;
  padding:9px 12px;font-size:13.5px;outline:none;
}
.finput:focus,.ftext:focus{border-color:var(--brand)}
.ftext{min-height:120px;resize:vertical;line-height:1.5}
.catgrid{display:flex;gap:6px;flex-wrap:wrap}
.catbtn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;
  border:1.5px solid var(--border);background:var(--card);font-size:12.5px;font-weight:700;color:var(--muted-foreground);
}
.catbtn:hover{border-color:var(--dust)}
.catbtn.on{border-color:var(--brand);color:var(--brand);background:var(--brand-surface)}
.dropzone{
  border:1.5px dashed var(--dust);border-radius:12px;padding:18px;text-align:center;
  color:var(--muted-foreground);font-size:12px;background:var(--lifted);
}
.dropzone b{color:var(--brand);font-weight:700}
.fileup{display:flex;gap:8px;margin-top:8px}
.thumb{
  width:64px;height:64px;border-radius:10px;border:1px solid var(--border);background:var(--muted);
  display:grid;place-items:center;color:var(--muted-foreground);position:relative;
}
.thumb .rm{
  position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;
  background:var(--foreground);color:var(--background);font-size:10px;display:grid;place-items:center;
}
.fsubmit{display:flex;align-items:center;gap:12px;margin-top:4px}
.fas{font-size:11.5px;color:var(--muted-foreground)}
.fas b{font-weight:700;color:var(--foreground)}

/* ============ /support detail ============ */
.back{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted-foreground);margin-bottom:10px;border-radius:8px;padding:4px 8px 4px 4px}
.back:hover{background:var(--muted);color:var(--foreground)}
.dhead{margin-bottom:6px}
.dtitle{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.dnum{color:var(--muted-foreground);font-weight:600}
.dmeta{display:flex;align-items:center;gap:10px;margin:8px 0 20px;font-size:12px;color:var(--muted-foreground);flex-wrap:wrap}
.thread{max-width:720px}
.tl{position:relative;padding-left:0}
.ccard{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden}
.chead{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--lifted);border-bottom:1px solid var(--border);font-size:12px}
.chead .avatar{width:22px;height:22px;font-size:9px}
.chead b{font-weight:800}
.chead .when{color:var(--muted-foreground)}
.chead .edited{color:var(--muted-foreground);font-style:italic}
.chead .editbtn{margin-left:auto;color:var(--muted-foreground);font-size:11px;font-weight:700;border-radius:7px;padding:3px 8px}
.chead .editbtn:hover{background:var(--muted);color:var(--foreground)}
.cbody{padding:13px 14px;font-size:13.5px;line-height:1.55}
.cbody .attachrow{display:flex;gap:8px;margin-top:10px}
.evrow{
  display:flex;align-items:center;gap:9px;padding:4px 0 4px 4px;margin:0 0 14px;
  font-size:12px;color:var(--muted-foreground);
}
.evrow .evic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.evrow .evic.done{background:var(--done);color:#fff}
.evrow .evic.gray{background:var(--gray);color:#fff}
.evrow .evic.open{background:var(--open);color:#fff}
.evrow b{color:var(--foreground);font-weight:700}
.cformwrap{border-top:1px solid var(--border);margin-top:6px;padding-top:18px}
.cform{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.cform textarea{width:100%;border:none;outline:none;background:transparent;padding:12px 14px;min-height:84px;resize:vertical;font-size:13.5px;line-height:1.5}
.cactions{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--lifted);border-top:1px solid var(--border)}
.attachbtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted-foreground);padding:6px 10px;border-radius:9px}
.attachbtn:hover{background:var(--muted);color:var(--foreground)}
.caspacer{flex:1}
/* close split-button */
.splitwrap{position:relative;display:inline-flex}
.splitmain{
  display:inline-flex;align-items:center;gap:7px;padding:7px 12px;font-size:12.5px;font-weight:700;
  border:1.5px solid var(--border);background:var(--card);border-radius:10px 0 0 10px;border-right:none;
}
.splitmain:hover{background:var(--muted)}
.splitcaret{
  display:grid;place-items:center;width:28px;border:1.5px solid var(--border);
  background:var(--card);border-radius:0 10px 10px 0;color:var(--muted-foreground);
}
.splitcaret:hover{background:var(--muted)}
.reasonmenu{
  position:absolute;bottom:calc(100% + 6px);right:0;width:230px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--card-shadow);padding:5px;z-index:30;display:none;
}
.reasonmenu.show{display:block}
.rmi{display:flex;align-items:flex-start;gap:9px;width:100%;padding:8px 10px;border-radius:9px;text-align:left}
.rmi:hover{background:var(--muted)}
.rmi .rt{font-size:12.5px;font-weight:700;line-height:1.2}
.rmi .rd{font-size:10.5px;color:var(--muted-foreground);margin-top:1px}
.rmi .sic{margin-top:2px}

/* ============ tracking/order link + Order Timeline modal (main-dashboard pattern) ============ */
.tlink{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.94em;color:var(--brand);font-weight:600}
.tlink:hover{text-decoration:underline}
.tpanel{
  width:500px;max-width:94vw;max-height:88vh;
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--card-shadow);display:flex;flex-direction:column;overflow:hidden;
  animation:pop .16s ease-out;
}

/* '#' parcel mention popup — GitHub-style: anchored below the caret, typing after '#'
   filters in place (no inner search input), ↑/↓ + Enter to pick. Row design from
   AlertReconcileDropdown. */
let mAnchor=null, mHits=[], mSel=0;
function mHitList(term){
  const t=(term||"").toLowerCase();
  return PARCELS.filter(p=>!t||p.trk.toLowerCase().includes(t)||p.ord.toLowerCase().includes(t)).slice(0,5);
}
/* highlight the matched character run (contiguous substring, any start position —
   same behaviour as the export-invoice search bar) */
function hl(str,term){
  const t=(term||"").toLowerCase();
  if(!t)return str;
  const i=str.toLowerCase().indexOf(t);
  if(i<0)return str;
  return str.slice(0,i)+`<span class="hlm">${str.slice(i,i+t.length)}</span>`+str.slice(i+t.length);
}
function mrowsHtml(term){
  return mHits.length?mHits.map((p,i)=>`
    <button class="mrow${i===mSel?" sel":""}" onclick="insertParcel('${p.trk}')" onmouseenter="mSel=${i};paintRows()">
      <span class="plat" style="background:${p.platBg}">${p.plat}</span>
      <div style="flex:1;min-width:0">
        <div class="trk">${hl(p.trk,term)}</div>
        <div class="sub">${hl(p.ord,term)} · ${p.when} <span class="sbadge" style="${p.sCls}">${p.status}</span></div>
      </div>
    </button>`).join(""):`<div class="mempty">No parcel matches “${term}”</div>`;
}
function paintRows(){
  const r=document.getElementById("mrows");
  if(r)r.querySelectorAll(".mrow").forEach((el,i)=>el.classList.toggle("sel",i===mSel));
}
/* caret x/y inside a textarea via a hidden mirror div */
function caretXY(ta){
  const d=document.createElement("div"), s=getComputedStyle(ta);
  for(const p of ["fontFamily","fontSize","fontWeight","letterSpacing","lineHeight","paddingTop","paddingRight","paddingBottom","paddingLeft","borderWidth","boxSizing"]) d.style[p]=s[p];
  d.style.position="absolute";d.style.visibility="hidden";d.style.whiteSpace="pre-wrap";
  d.style.wordWrap="break-word";d.style.width=ta.clientWidth+"px";d.style.top="0";d.style.left="0";
  d.textContent=ta.value.substring(0,ta.selectionStart);
  const sp=document.createElement("span");sp.textContent="​";d.appendChild(sp);
  ta.parentElement.appendChild(d);
  const lh=parseFloat(s.lineHeight)||18;
  const xy={x:sp.offsetLeft,y:sp.offsetTop+lh};
  d.remove();
  return xy;
}
function openMention(anchor,term){
  mAnchor=anchor;mHits=mHitList(term);mSel=0;
  const ta=document.getElementById("ta-"+anchor);
  const {x,y}=caretXY(ta);
  const left=Math.min(ta.offsetLeft+x, Math.max(0,(ta.parentElement.clientWidth||360)-310));
  const top=ta.offsetTop+y-ta.scrollTop+4;
  document.getElementById("mpop-"+anchor).innerHTML=`
  <div class="mpop" style="left:${left}px;top:${top}px">
    <div id="mrows">${mrowsHtml(term)}</div>
  </div>`;
}
function closeMention(){
  if(!mAnchor)return;
  const c=document.getElementById("mpop-"+mAnchor);
  if(c)c.innerHTML="";
  mAnchor=null;mHits=[];mSel=0;
}
function taInput(which){
  const ta=document.getElementById("ta-"+which);
  const m=ta.value.substring(0,ta.selectionStart).match(/#([\w-]*)$/);
  if(m)openMention(which,m[1]);
  else if(mAnchor===which)closeMention();
}
function taKey(e,which){
  if(mAnchor!==which)return;
  if(e.key==="ArrowDown"){e.preventDefault();mSel=Math.min(mSel+1,mHits.length-1);paintRows();}
  else if(e.key==="ArrowUp"){e.preventDefault();mSel=Math.max(mSel-1,0);paintRows();}
  else if(e.key==="Enter"){e.preventDefault();if(mHits[mSel])insertParcel(mHits[mSel].trk);}
  else if(e.key==="Escape"){closeMention();}
}
function fieldPop(){
  mAnchor="relparcel";
  const v=document.getElementById("inp-relparcel").value;
  mHits=mHitList(v);mSel=0;
  document.getElementById("mpop-relparcel").innerHTML=`
  <div class="mpop below">
    <div class="mhint">Matching parcels — tracking or order</div>
    <div id="mrows">${mrowsHtml(v)}</div>
  </div>`;
}
function insertParcel(trk){
  const a=mAnchor;closeMention();
  if(a==="relparcel"){document.getElementById("inp-relparcel").value=trk;}
  else if(a){const ta=document.getElementById("ta-"+a);ta.value=ta.value.replace(/#[\w-]*$/,trk+" ");ta.focus();}
}

/* ============ wiring ============ */
function go(v){view=v;reasonOpen=false;renderMain();}
function setFilter(f){filter=f;renderMain();}
function pickCat(c){newCat=c;renderNewModal();}
function toggleReason(){reasonOpen=!reasonOpen;renderMain();}
function openSettings(){menuOpen=false;renderSidebar();document.getElementById("scrim").classList.add("show");document.getElementById("smodal").classList.add("show");}
function closeSettings(){document.getElementById("scrim").classList.remove("show");document.getElementById("smodal").classList.remove("show");}
function toggleMenu(e){e.stopPropagation();menuOpen=!menuOpen;renderSidebar();}
function toggleRail(){rail=!rail;menuOpen=false;renderSidebar();}
function pick(t){
  themeSel=t;
  const dark = t==="dark" || (t==="system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark",dark);
  syncDarkBtn();renderSidebar();renderTheme();
}
function toggleDark(){document.documentElement.classList.toggle("dark");syncDarkBtn();}
function syncDarkBtn(){document.getElementById("darkbtn").textContent=document.documentElement.classList.contains("dark")?"Light":"Dark";}
document.addEventListener("click",e=>{
  let dirty=false;
  if(menuOpen){menuOpen=false;renderSidebar();}
  if(reasonOpen){reasonOpen=false;dirty=true;}
  if(mAnchor && !e.target.closest(".mpop") && !e.target.closest("#inp-relparcel") && !e.target.closest("textarea"))closeMention();
  if(dirty)renderMain();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSettings();closeNew();closeTimeline();closeMention();if(reasonOpen){reasonOpen=false;renderMain();}}});
renderSidebar();renderTheme();renderMain();
</script>
