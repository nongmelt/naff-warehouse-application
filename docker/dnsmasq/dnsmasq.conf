# ── dnsmasq configuration ─────────────────────────────────────────────────────
# Resolve *.warehouse.local to the server running Docker.
# Replace SERVER_IP with the actual LAN IP of the Docker host
# (e.g. 192.168.1.10). Clients must point their DNS to this host's port 53.

# Don't read system hosts / resolv.conf — we control everything here
no-hosts
no-resolv

# Upstream DNS (used for all non-local queries)
server=8.8.8.8
server=8.8.4.4

# ── warehouse.local domains ───────────────────────────────────────────────────
# Each line maps a hostname to the IP where Traefik is listening on port 80.
# Change SERVER_IP to match your Docker host's LAN address.
address=/app.warehouse.local/SERVER_IP
address=/api.warehouse.local/SERVER_IP
address=/minio.warehouse.local/SERVER_IP
address=/console.warehouse.local/SERVER_IP
address=/traefik.warehouse.local/SERVER_IP

# Alternatively, resolve the entire *.warehouse.local wildcard:
# address=/.warehouse.local/SERVER_IP

# ── General settings ──────────────────────────────────────────────────────────
# Listen on all interfaces inside the container
listen-address=0.0.0.0

# Cache 1000 DNS records
cache-size=1000

# Reduce TTL for local entries so IP changes propagate quickly
local-ttl=10

# Log queries (optional – comment out to reduce noise)
log-queries
